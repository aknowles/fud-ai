<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Add a meal · Fud AI</title>
  <meta name="theme-color" content="#FF375F" />
  <meta name="robots" content="noindex" />
  <meta name="referrer" content="no-referrer" />

  <!-- Social preview (WhatsApp/iMessage show this card for the link) -->
  <meta property="og:title" content="Someone shared a meal with you" />
  <meta property="og:description" content="Open in Fud AI to add it to your log in one tap." />
  <meta property="og:image" content="https://www.fud-ai.app/assets/opengraph.jpg?v=20260722" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="icon" href="/assets/fud-icon-192.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400..700&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --pink: #ff375f;
      --ink: #000;
      --paper: #fff;
      --blush: #ffe8ee;
      --graphite: #4a4a4a;
      --rule: rgba(0, 0, 0, 0.12);
      --text: 'Atkinson Hyperlegible Next', ui-sans-serif, system-ui, sans-serif;
      --display: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--text);
      background: var(--pink);
      color: var(--ink);
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 16px calc(28px + env(safe-area-inset-bottom));
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: var(--paper);
      border-radius: 28px;
      padding: 28px 22px 24px;
      box-shadow: 0 40px 80px -40px rgba(0, 0, 0, 0.45);
    }
    .brand {
      display: flex; align-items: center; gap: 10px;
      font-family: var(--display); font-weight: 800; font-stretch: 90%;
      font-size: 20px; letter-spacing: -0.02em;
      margin-bottom: 24px;
    }
    .brand img { width: 32px; height: 32px; padding: 3px; border-radius: 9px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--rule); }
    h1 {
      font-family: var(--display);
      font-weight: 800; font-stretch: 90%;
      font-size: 30px; line-height: 1.04; letter-spacing: -0.025em;
      margin-bottom: 8px;
    }
    .sub { color: var(--graphite); font-size: 16px; line-height: 1.5; margin-bottom: 20px; }
    .meal {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 0; border-top: 1px solid var(--rule);
    }
    .meal:last-of-type { border-bottom: 1px solid var(--rule); }
    .emoji {
      width: 44px; height: 44px; flex: none;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; background: var(--blush); border-radius: 14px;
    }
    .meal .name { font-weight: 700; font-size: 17px; line-height: 1.3; }
    .meal .macros { color: var(--graphite); font-size: 14px; margin-top: 2px; font-variant-numeric: tabular-nums; }
    .meal .kcal { margin-left: auto; font-weight: 700; font-size: 17px; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .total { text-align: right; font-weight: 700; font-size: 15px; margin: 14px 0 0; font-variant-numeric: tabular-nums; }
    .cta {
      display: block; width: 100%; margin-top: 22px;
      background: var(--ink);
      color: var(--paper); font-family: var(--text); font-weight: 700; font-size: 17px;
      text-align: center; text-decoration: none;
      padding: 17px; border: none; border-radius: 999px; cursor: pointer;
    }
    .cta:hover { background: #2b2b2b; }
    .cta:active { transform: translateY(1px); }
    .note { text-align: center; color: var(--graphite); font-size: 14px; margin-top: 14px; line-height: 1.5; }
    .note a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--pink); text-decoration-thickness: 2px; text-underline-offset: 0.2em; }
    .stores { display: flex; gap: 10px; justify-content: center; margin-top: 14px; }
    .stores a {
      color: var(--ink); text-decoration: none; font-size: 15px; font-weight: 700;
      border-radius: 999px; padding: 11px 16px;
      box-shadow: inset 0 0 0 1.5px var(--ink);
    }
    .stores a:hover { background: var(--blush); }
    a:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
    .err { color: var(--graphite); font-size: 16px; line-height: 1.55; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <img src="/assets/fud-icon-192.png" alt="" />
      Fud AI
    </div>
    <div id="content"><p class="err">Loading shared meal…</p></div>
  </main>

  <script>
    var APP_STORE = "https://apps.apple.com/us/app/fud-ai-calorie-tracker/id6758935726";
    var PLAY_STORE = "https://play.google.com/store/apps/details?id=com.apoorvdarshan.calorietracker";

    function param(name) {
      var m = new RegExp("[?&]" + name + "=([^&]+)").exec(window.location.search);
      return m ? m[1] : null;
    }

    function decodePayload(d) {
      var s = d.replace(/-/g, "+").replace(/_/g, "/");
      while (s.length % 4) s += "=";
      var bin = atob(s);
      var bytes = Uint8Array.from(bin, function (c) { return c.charCodeAt(0); });
      var text = new TextDecoder("utf-8").decode(bytes);
      return JSON.parse(text);
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }
    function r(n) { return Math.round(Number(n) || 0); }

    function storesHtml() {
      return '<div class="stores"><a rel="noreferrer" href="' + APP_STORE + '">App Store</a>' +
             '<a rel="noreferrer" href="' + PLAY_STORE + '">Google Play</a></div>';
    }

    function render() {
      var content = document.getElementById("content");
      var d = param("d");
      if (!d) {
        content.innerHTML = '<h1>Nothing to add</h1><p class="sub">This link doesn\'t contain a shared meal.</p>' + storesHtml();
        return;
      }
      var data;
      try { data = decodePayload(d); } catch (e) { data = null; }
      var meals = data && Array.isArray(data.meals) ? data.meals : null;
      if (!meals || !meals.length) {
        content.innerHTML = '<h1>Couldn\'t read this meal</h1><p class="sub">The link may be incomplete. Ask your friend to share it again.</p>' + storesHtml();
        return;
      }

      var total = 0;
      var rows = meals.map(function (m) {
        total += Number(m.calories) || 0;
        var emoji = m.emoji ? esc(m.emoji) : "🍽️";
        return '<div class="meal">' +
          '<div class="emoji">' + emoji + '</div>' +
          '<div><div class="name">' + esc(m.name || "Meal") + '</div>' +
          '<div class="macros">' + r(m.protein) + "P · " + r(m.carbs) + "C · " + r(m.fat) + 'F</div></div>' +
          '<div class="kcal">' + r(m.calories) + ' kcal</div></div>';
      }).join("");

      var title = meals.length === 1 ? "A meal was shared with you" : meals.length + " meals were shared with you";
      var fudaiLink = "fudai://add-meal?d=" + encodeURIComponent(d);

      content.innerHTML =
        '<h1>' + esc(title) + '</h1>' +
        '<p class="sub">Add it to your Fud AI log — with the exact nutrients, no re-scanning.</p>' +
        rows +
        (meals.length > 1 ? '<div class="total">' + r(total) + ' kcal total</div>' : "") +
        '<a class="cta" id="open" href="' + esc(fudaiLink) + '">Add to Fud AI</a>' +
        '<p class="note">Opens the app to confirm. Don\'t have Fud AI yet?</p>' +
        storesHtml() +
        '<p class="note">The meal details shown above are contained in this shared URL. <a href="/privacy.html">Privacy</a></p>';

      // Best-effort auto-open for users who already have the app.
      setTimeout(function () { try { window.location.href = fudaiLink; } catch (e) {} }, 350);
    }

    render();
  </script>
</body>
</html>
